<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .image-item {
            transition: transform 0.2s; /* Плавная анимация при наведении */
        }
        .image-item:hover {
            transform: scale(1.05); /* Увеличиваем масштаб элемента */
        }
        .card-img-top {
            object-fit: cover;
            height: 200px; /* Фиксированная высота изображения */
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center mb-4">Загруженные изображения</h1>
    <div class="text-center mb-3">
        <a href="/" class="btn btn-primary">Главная</a>
    </div>

    <!-- Контейнер для карточек изображений -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3" id="imageContainer"></div>
</div>

<!-- Подключение скриптов -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="all_images.js"></script>
</body>
</html>
