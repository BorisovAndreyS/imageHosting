http {
    include mime.types;

    server{
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;

        }

        location /upload {
            proxy_pass http://app:8000/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            }

#         location /images/ {
#             proxy_pass http://app:8000/images;
#             proxy_set_header Host $host;
#             proxy_set_header X-Real-IP $remote_addr;
#
#             }
        location /images-list {
            alias /usr/share/nginx/html/static;
            index images-list.html;

            }
        location /api/images-list {
            proxy_pass http://app:8000/api/images-list;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            }

        location /all_images {
            alias /usr/share/nginx/html/static;
            index all_images.html;

            }

        location /api/all_images {
            proxy_pass http://app:8000/api/all_images;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            }


        # Отдача изображений через Nginx
        location ~ /images/.*.(gif|jpg|png|jpeg)$ {
            root /usr/share/nginx;  # Указываем корень, чтобы путь был /usr/share/nginx/images/
            try_files $uri =404;
        }


        location /favicon.ico {
            alias /usr/share/nginx/html/;
            }
        }
        }

events{}
